name: Deploy static CAD app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: adigun-static-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify published example data
        run: node scripts/project-library-validation.js --check
      - name: Verify published component inventory
        run: node scripts/export-component-bank.js
      - name: Stage public site
        run: |
          site="$RUNNER_TEMP/adigun-pages"
          mkdir -p "$site/examples/real-projects" "$site/docs/reports" "$site/vendor"
          cp index.html terminal-catalog.js cad-engine.js cad-dxf.js service-worker.js CNAME .nojekyll "$site/"
          cp vendor/dxf-parser-1.1.2.js vendor/dxf-writer-2.8.9.mjs vendor/*LICENSE.txt "$site/vendor/"
          cp examples/real-projects/library.json examples/real-projects/*.adigun.json "$site/examples/real-projects/"
          cp docs/reports/project-library-validation.json docs/reports/component-bank.json docs/reports/component-bank.csv "$site/docs/reports/"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/adigun-pages
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts"
          for delay in 0 2 4 8 16 30; do
            sleep "$delay"
            if gh api --method GET "$endpoint" -f name="$PAGES_ARTIFACT" \
              --jq '.artifacts[] | select(.expired == false) | .name' | grep -Fxq "$PAGES_ARTIFACT"; then
              exit 0
            fi
          done
          echo "::error::Pages artifact did not become visible: $PAGES_ARTIFACT"
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
