name: Verify electrical CAD model

on:
  pull_request:
    paths:
      - "cad-engine.js"
      - "cad-engine.test.js"
      - "cad-engine-project.test.js"
      - ".github/workflows/cad-engine-tests.yml"
      - "index.html"
      - "service-worker.js"
      - "cad-dxf.js"
      - "vendor/**"
      - "examples/real-projects/**"
      - "docs/components/**"
      - "docs/reports/project-library-validation.json"
      - "scripts/project-library-validation.js"
  push:
    branches: [main]
    paths:
      - "cad-engine.js"
      - "cad-engine.test.js"
      - "cad-engine-project.test.js"
      - ".github/workflows/cad-engine-tests.yml"
      - "index.html"
      - "service-worker.js"
      - "cad-dxf.js"
      - "vendor/**"
      - "examples/real-projects/**"
      - "docs/components/**"
      - "docs/reports/project-library-validation.json"
      - "scripts/project-library-validation.js"

permissions:
  contents: read

jobs:
  cad-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned Playwright
        run: npm install --no-save --package-lock=false playwright@1.65.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test source-backed component model and connectivity
        run: node --test cad-engine.test.js cad-engine-project.test.js
        env:
          CAD_BROWSER_WORKFLOW: "1"
      - name: Check generated project-library validation report
        run: node scripts/project-library-validation.js --check
